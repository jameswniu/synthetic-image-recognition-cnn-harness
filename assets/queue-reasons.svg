<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 508" role="img" aria-label="Why boxes go to a person">
<rect width="1200" height="508" fill="#fafafa"/>
<defs><linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f5f5"/><stop offset="0.5" stop-color="#d4d4d8"/><stop offset="1" stop-color="#a1a1aa"/></linearGradient></defs>
<text x="48" y="58" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#111111" text-anchor="start">Why boxes go to a person</text>
<text x="48" y="94" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#3f3f46" text-anchor="start">the review queue, grouped by what the system could not settle</text>
<rect x="48" y="122" width="1104" height="308" fill="#ffffff" stroke="url(#rim)" stroke-width="1.75"/>
<text x="510" y="172" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="end">Pen line through it</text>
<rect x="528" y="154" width="454.0" height="24" fill="#52525b" stroke="#111111"/>
<text x="996.0" y="172" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="start">64</text>
<text x="510" y="226" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="end">Expected, not found</text>
<rect x="528" y="208" width="397.2" height="24" fill="#52525b" stroke="#111111"/>
<text x="939.25" y="226" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="start">56</text>
<text x="510" y="280" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="end">Too little ink</text>
<rect x="528" y="262" width="113.5" height="24" fill="#52525b" stroke="#111111"/>
<text x="655.5" y="280" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="start">16</text>
<text x="510" y="334" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="end">Not on the blank form</text>
<rect x="528" y="316" width="63.8" height="24" fill="#52525b" stroke="#111111"/>
<text x="605.84375" y="334" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="start">9</text>
<text x="510" y="388" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="end">Specks, not a stroke</text>
<rect x="528" y="370" width="7.1" height="24" fill="#52525b" stroke="#111111"/>
<text x="549.09375" y="388" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#111111" text-anchor="start">1</text>
<text x="48" y="474" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" fill="#3f3f46" text-anchor="start">138 of 5,872 boxes across 61 pages · reports/telemetry.json</text>
